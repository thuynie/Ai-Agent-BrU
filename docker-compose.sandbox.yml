version: '3.8'

services:
  browser_sandbox:
    image: browserless/chrome:latest
    container_name: booking_agent_sandbox
    ports:
      - "9222:3000"
    environment:
      - MAX_CONCURRENT_SESSIONS=3
      - CONNECTION_TIMEOUT=60000
      - CHROME_REFRESH_TIME=3600000
      - PRE_BOOT_VOLUME=false
      - KEEP_ALIVE=true
    shm_size: '2gb'
    restart: unless-stopped
